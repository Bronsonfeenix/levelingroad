<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Leveling Road</title>
  <meta name="description" content="A World of Warcraft Classic inspired idle RPG. Pick a faction, race and class, then grind, loot and talent your way to level 60.">
  <meta name="theme-color" content="#120d09">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/wow-skin.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">⚔️ <span>The Leveling Road</span></div>
      <div class="xpwrap">
        <div class="xpbar"><div class="xpfill" id="xpFill"></div><div class="xptext" id="xpText"></div></div>
      </div>
      <div class="money" id="money"></div>
      <button class="mutebtn" id="muteBtn" type="button" aria-label="Mute music">🔊</button>
    </header>

    <!-- Battlefield: hero on the left, enemies approach from the right -->
    <section class="stage" id="stage">
      <canvas id="game"></canvas>
      <canvas id="fxText"></canvas>

      <div class="hudleft">
        <div class="frame player">
          <div class="portrait"><span id="pIcon">⚔️</span><span class="lvl" id="pLevel">1</span></div>
          <div class="bars">
            <div class="fname" id="pName"></div>
            <div class="bar hp"><div class="fill" id="pHp"></div><span id="pHpText"></span></div>
            <div class="bar res" id="pResBar" data-res="rage"><div class="fill" id="pRes"></div><span id="pResText"></span></div>
          </div>
        </div>
        <div class="combo" id="combo"></div>
        <div class="buffs" id="buffs"></div>
        <div class="party hidden" id="party"></div>
        <div class="castbar hidden" id="cast"><div class="fill" id="castFill"></div><span id="castText"></span></div>
      </div>

      <div class="hudright">
        <div class="frame target vhide" id="target">
          <div class="bars">
            <div class="fname"><span id="tName"></span> <span class="elitetag">Elite</span></div>
            <div class="bar hp"><div class="fill" id="tHp"></div><span id="tHpText"></span></div>
            <div class="ttype" id="tType"></div>
            <div class="tcast hidden" id="tCast"><div class="fill" id="tCastFill"></div><span id="tCastText"></span></div>
          </div>
          <div class="portrait"><canvas id="tPortrait" width="128" height="128"></canvas><span class="lvl" id="tLevel">1</span></div>
        </div>
        <div class="buffs right" id="tDebuffs"></div>
        <div class="qtrack" id="qtrack"></div>
      </div>

      <div class="zonelabel" id="zoneLabel"></div>
      <div class="dprog hidden" id="dprog"></div>
      <div class="achtoast" id="achToast"></div>
      <div class="zonebanner" id="zoneBanner"></div>
      <div class="taphint" id="tapHint">Tap to strike!</div>
      <div class="uierror" id="uiError"></div>
      <!-- Action bar: click or press 1–0, -, = -->
      <div class="actionbar-wrap" id="actionbarWrap"><div class="actionbar" id="actionbar"></div></div>
      <div class="death hidden" id="death">
        <div class="dtitle">You have died</div>
        <div class="dsub">Releasing spirit… returning from the Spirit Healer in <span id="deathTimer">6</span></div>
      </div>
    </section>


    <!-- Menus -->
    <nav class="tabs" id="tabs"></nav>
    <section class="panel" id="panel"></section>

    <footer class="foot">A fan-made idle RPG inspired by World of Warcraft Classic. Not affiliated with Blizzard Entertainment. Progress is saved in your browser.</footer>
  </div>

  <div class="create hidden" id="create"></div>
  <div class="tooltip hidden" id="tooltip"></div>
  <div class="toast" id="toast"></div>
  <div class="modal hidden" id="modal"></div>

  <script src="js/data.js"></script>
  <script src="js/classes.js"></script>
  <script src="js/talents.js"></script>
  <script src="js/gearlook.js"></script>
  <script src="js/render.js"></script>
  <script src="js/pixelfx.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/account.js"></script>
  <script src="js/quests.js"></script>
  <script src="js/music.js"></script>
  <script src="js/instances.js"></script>
  <script src="js/raids.js"></script>
  <script src="js/party.js"></script>
  <script src="js/collections.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
